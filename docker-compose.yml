version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: medilink-db
    environment:
      POSTGRES_DB: medilink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: More@2525
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medilink-redis
    ports:
      - "6379:6379"

  backend:
    build: ./medilink-backend
    container_name: medilink-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/medilink
      - DB_USERNAME=postgres
      - DB_PASSWORD=More@2525
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=change-this-jwt-secret-key-with-at-least-32-chars
      - QR_SECRET=change-this-qr-secret-key-with-at-least-32-chars
    depends_on:
      - db
      - redis

  frontend:
    build: ./medilink-frontend
    container_name: medilink-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
