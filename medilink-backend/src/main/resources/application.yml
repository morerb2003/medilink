spring:
  application:
    name: medilink-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medilink}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:More@2525}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

app:
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  storage:
    bucket: ${S3_BUCKET:medilink-dev-bucket}

aws:
  region: ${AWS_REGION:ap-south-1}
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-jwt-secret-key-with-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  qr:
    secret: ${QR_SECRET:change-this-qr-secret-key-with-at-least-32-chars}
    expiration-ms: ${QR_EXPIRATION_MS:900000}

logging:
  level:
    com.medilink: INFO
